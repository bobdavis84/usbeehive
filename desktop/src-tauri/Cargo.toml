[package]
name = "usbeehive-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "usbeehive_desktop"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2", features = [] }
usbeehive = { path = "../..", default-features = false, features = ["sysfs", "watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
